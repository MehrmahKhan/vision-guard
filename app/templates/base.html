<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="brand">
      <span class="logo">VG</span>
