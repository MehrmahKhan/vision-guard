{% extends "base.html" %}
{% block title %}VisionGuard &middot; {{ code }}{% endblock %}

{% block content %}
<section class="card">
  <div class="error-badge">{{ code }}</div>
  <h1>That did not work</h1>
  <p class="error-message">{{ message }}</p>
  {% if hint %}<p class="error-hint">{{ hint }}</p>{% endif %}
  <div class="actions">
    <a class="primary" href="{{ url_for('index') }}">Try again</a>
  </div>
</section>
{% endblock %}
