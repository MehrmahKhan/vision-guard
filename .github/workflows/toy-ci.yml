# Task 6.6 (toy part) - put this in a THROWAWAY repository, not in VisionGuard.
#
# It runs on every push, uses a matrix of two Python versions, and runs one
# small test file. Make test_toy.py fail once to capture the red run, then fix
# it to capture the green run.
#
# The matching test file, tests/test_toy.py in the throwaway repo:
#
#   def add(a, b):
#       return a + b
#
#   def test_add():
#       assert add(2, 2) == 4        # change to 5 to make it red
#
#   def test_strings():
#       assert "vision" + "guard" == "visionguard"

name: toy-ci

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run the tests
        run: pytest -q
