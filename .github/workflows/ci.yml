# Task 6.6 (apply part) - CI for VisionGuard.
#
# Secrets: nothing secret is written in this file. GitHub stores them under
# Settings -> Secrets and variables -> Actions, and they arrive as
# ${{ secrets.NAME }} at run time. A workflow file is committed to the
# repository, so a token pasted here would be readable by anyone who can see
# the repo, would stay in the Git history after you removed it, and would be
# printed in plain text in every log line that echoed it.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 app src model_api tests --max-line-length=100 --extend-ignore=E203,E402,W503,E712

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///ci_visionguard.db
          MAX_UPLOAD_MB: "1"
          MODEL_PATH: models/does-not-exist.keras
        run: |
          pytest -q

  docker:
    name: build the docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: visionguard-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image size
        run: |
          docker image ls visionguard-web:ci || true
